<!doctype html>
<html lang="zh-CN">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover" />
    <meta name="robots" content="noindex, nofollow, noarchive" />
    <title>京东旅行｜找茬预览版</title>
    <style>
      * { box-sizing: border-box; }
      html, body { width: 100%; min-height: 100%; margin: 0; }
      body {
        display: grid;
        min-width: 426px;
        min-height: 922px;
        place-items: center;
        padding: 18px 12px 24px;
        color: #202020;
        background: #ececeb;
        font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }
      .preview-label {
        margin-bottom: 10px;
        color: #777;
        font-size: 12px;
        letter-spacing: 0.02em;
        text-align: center;
      }
      .device {
        position: relative;
        width: 426px;
        height: 898px;
        padding: 12px;
        border-radius: 58px;
        background: #151515;
        box-shadow: 0 24px 70px rgba(0, 0, 0, 0.2), 0 0 0 1px rgba(0, 0, 0, 0.2);
      }
      .screen {
        position: relative;
        width: 402px;
        height: 874px;
        overflow: hidden;
        border-radius: 47px;
        background: #fff;
      }
      .status-bar {
        position: absolute;
        top: 0;
        right: 0;
        left: 0;
        z-index: 3;
        display: flex;
        height: 48px;
        align-items: center;
        justify-content: space-between;
        padding: 8px 22px 0;
        color: #fff;
        pointer-events: none;
        font-size: 14px;
        font-weight: 700;
        text-shadow: 0 1px 8px rgba(0, 0, 0, 0.32);
      }
      .status-icons { display: flex; align-items: center; gap: 7px; }
      .island {
        position: absolute;
        top: 10px;
        left: 50%;
        width: 106px;
        height: 28px;
        transform: translateX(-50%);
        border-radius: 999px;
        background: #111;
      }
      .signal { display: flex; height: 13px; align-items: flex-end; gap: 2px; }
      .signal i { display: block; width: 3px; border-radius: 2px; background: #fff; }
      .signal i:nth-child(1) { height: 5px; }
      .signal i:nth-child(2) { height: 8px; }
      .signal i:nth-child(3) { height: 11px; }
      .signal i:nth-child(4) { height: 13px; }
      .network { font-size: 11px; letter-spacing: -0.02em; }
      .battery {
        position: relative;
        width: 24px;
        height: 12px;
        padding: 2px;
        border: 1.5px solid #fff;
        border-radius: 4px;
      }
      .battery::before {
        display: block;
        width: 75%;
        height: 100%;
        border-radius: 2px;
        background: #fff;
        content: "";
      }
      .battery::after {
        position: absolute;
        top: 3px;
        right: -4px;
        width: 2px;
        height: 5px;
        border-radius: 0 2px 2px 0;
        background: #fff;
        content: "";
      }
      iframe {
        position: absolute;
        inset: 0;
        width: 100%;
        height: 100%;
        border: 0;
        background: #fff;
      }
      @media (max-width: 600px) {
        html, body { height: 100%; min-height: 100%; }
        body { display: block; min-width: 0; padding: 0; background: #fff; }
        main, .device, .screen { width: 100%; height: 100%; }
        .preview-label, .status-bar { display: none; }
        .device, .screen { padding: 0; border-radius: 0; box-shadow: none; }
      }
    </style>
  </head>
  <body>
    <main>
      <div class="preview-label">iPhone 17 逻辑视口 · 402 × 874</div>
      <div class="device">
        <div class="screen">
          <div class="status-bar" aria-hidden="true">
            <span>9:41</span>
            <span class="island"></span>
            <div class="status-icons"><span class="signal"><i></i><i></i><i></i><i></i></span><span class="network">5G</span><span class="battery"></span></div>
          </div>
          <iframe id="page-frame" src="./app/index.html" title="京东旅行宝藏玩法共创"></iframe>
        </div>
      </div>
    </main>
  </body>
</html>
